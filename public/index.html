<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBot</title>
<link rel="icon" href="/assets/logo.ico" sizes="any"><link rel="icon" type="image/png" href="/assets/logo.png"><link rel="apple-touch-icon" href="/assets/logo.png">

<style>
:where(:root){--bg:#1b1c24;--p1:#23242e;--p2:#2b2d3a;--ln:#363846;--tx:#eef0f6;--mu:#9a9db0;--ac:#f4503f;--bl:#4f7cf5;--gr:#3ccf6e;--yl:#f5a623;--in:#16171e;--dot:#2d2f3c;--dot2:#3a3d52;--ln2:#3a3f4b;--hv:#ffffff08;--fv:#5b5e70}
:where(:root[data-theme=light]){--bg:#f2f3f8;--p1:#ffffff;--p2:#eceef5;--ln:#d9dce8;--tx:#1d1f2b;--mu:#667085;--yl:#c77d00;--in:#ffffff;--dot:#d3d6e3;--dot2:#cdd1e0;--ln2:#d0d4e2;--hv:#00000008;--fv:#a3a7ba}
.thm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}.thm button{flex-direction:column;align-items:flex-start;gap:3px;padding:12px;text-align:left}.thm button small{color:var(--mu)}.thm button.on{border-color:var(--bl);box-shadow:0 0 0 2px var(--bl)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chips code{background:var(--bg);color:var(--yl);padding:2px 7px;border-radius:6px;font-size:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}

button:hover{border-color:var(--bl)}.pr{color:#fff;background:var(--ac);border-color:var(--ac);font-weight:700}.gr{background:var(--gr);border-color:var(--gr);color:#06240f;font-weight:700}.bl{color:#fff;background:var(--bl);border-color:var(--bl);font-weight:700}.x{color:#f87171}
input,select,textarea{width:100%;background:var(--in);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:9px;font:inherit}textarea{min-height:70px;resize:vertical}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:13px}label.ck input{width:auto}
.top{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--ln);background:var(--p1)}
.logo{font-weight:800;font-size:16px;color:var(--yl);margin-right:auto;display:flex;align-items:center;gap:8px}.logo img{width:28px;height:28px;border-radius:7px;object-fit:contain}
.pill{display:flex;gap:7px;align-items:center;background:var(--bg);padding:8px 12px;border-radius:9px}.dot{width:9px;height:9px;border-radius:50%;background:#777}.dot.on{background:var(--gr)}
.body{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 60px)}

.pt{margin:3px 0;line-height:1.4;word-break:break-word}.pt code{background:#1e1f22;padding:1px 4px;border-radius:4px}.h1{font-size:24px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}
.pe{display:flex;gap:12px;background:#2b2d31;border-left:4px solid #5865f2;border-radius:4px;padding:10px 14px;margin:4px 0;max-width:520px}.pec{flex:1;min-width:0}.pti{font-weight:700;margin:4px 0}.pa{display:flex;gap:6px;align-items:center;font-weight:600;font-size:13px}.pa img{width:22px;height:22px;border-radius:50%}
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}.pim{max-width:100%;border-radius:6px;margin-top:6px}.pth{width:70px;height:70px;border-radius:6px;object-fit:cover}.pfo{font-size:12px;color:#949ba4;margin-top:6px}
.prow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pb{background:#4e5058;color:#fff;padding:6px 14px;border-radius:6px;font-size:14px}.pb.primary{background:#5865f2}.pb.success{background:#248046}.pb.danger{background:#da373c}
.psel{background:#1e1f22;border:1px solid #3f4147;border-radius:6px;padding:9px 12px;max-width:400px;margin:6px 0;color:#949ba4}
.pc{background:#2b2d31;border-left:4px solid #5865f2;border-radius:8px;padding:12px;margin:6px 0;max-width:520px}.psc{display:flex;gap:12px;align-items:center;justify-content:space-between}.th{width:70px;height:70px;border-radius:6px;background:#4e5058;flex:none}
.pc hr,.pc2>hr{border:0;border-top:1px solid #3f4147;margin:10px 0}.pc hr.lg{margin:18px 0}.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px;margin:6px 0}.pg img{width:100%;border-radius:6px}
.mr pre{color:#dbdee1;font:12px monospace;white-space:pre-wrap}
@media(max-width:900px){.me{grid-template-columns:1fr;overflow:auto}}

.bd{display:grid;grid-template-columns:290px 1fr 320px;margin:-22px;height:calc(100vh - 60px)}
.cw{display:flex;flex-direction:column;min-width:0}.tb{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--ln);background:var(--p1)}
.cvs{flex:1;position:relative;overflow:hidden;background:radial-gradient(var(--dot2) 1px,transparent 1px) 0 0/22px 22px;cursor:default}
#world{position:absolute;left:0;top:0;transform-origin:0 0}#edges{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px;pointer-events:none}
.gn{position:absolute;width:280px;background:var(--p2);border:2px solid var(--ln);border-radius:12px;user-select:none;cursor:default}.gn.sel{border-color:var(--bl);box-shadow:0 0 0 3px #4f7cf544}.gn.st{width:340px;border-color:var(--yl)}
.gh2{display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:default}.gh2 b{flex:1}.gh2 button{padding:2px 7px}.gb{padding:0 12px 14px;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.port{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--bl);border:3px solid var(--bg);cursor:default;z-index:2}.port.in{top:-10px;background:#8b5cf6}.port.out{bottom:-10px}.port.g{background:var(--gr)}.port.r{background:#f87171}.port:hover{transform:scale(1.4)}
.lb{position:absolute;bottom:-28px;font-size:10px;color:var(--mu);transform:translateX(-50%)}
.pp{background:var(--p1);border-left:1px solid var(--ln);padding:16px;overflow:auto}.xc{pointer-events:all;cursor:pointer}
@media(max-width:1000px){.bd{grid-template-columns:1fr;height:auto}.cvs{height:70vh}}input[type=color]{height:40px;padding:3px;cursor:pointer}
.vd{margin:8px 0;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px}.vd summary{cursor:pointer;color:var(--yl);font-weight:600}.vls{max-height:240px;overflow:auto;margin-top:6px}.vd input{margin-top:8px}
.mdl{background:#313338;border-radius:8px;max-width:480px;margin:10px auto;padding:20px;color:#dbdee1;box-shadow:0 0 0 1px #1e1f22}.mdh{display:flex;justify-content:space-between;font-size:20px;margin-bottom:14px}
.mdf{margin-bottom:14px}.mdf label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:#b5bac1;margin:0 0 6px}.mdf i{color:#f23f42;font-style:normal}
.mdi{background:#1e1f22;border-radius:4px;padding:10px;min-height:40px;white-space:pre-wrap}.mdi.big{min-height:100px}
.mdb{display:flex;justify-content:flex-end;gap:16px;align-items:center;background:#2b2d31;margin:20px -20px -20px;padding:14px 20px;border-radius:0 0 8px 8px}
.port.o{background:var(--yl)}
.sb{display:flex;align-items:center;gap:8px;background:var(--in);border:1px solid var(--ln);border-radius:12px;padding:0 12px;margin:10px 0}.sb:focus-within{border-color:var(--bl)}.sb input{border:0;background:transparent;padding:11px 0;outline:0}
.bi{cursor:pointer}.bi small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bi>div:nth-child(2){min-width:0}
.fav{color:var(--fv);font-size:16px;padding:2px 4px;cursor:pointer;margin-left:auto}.fav:hover,.fav.on{color:var(--yl)}
.ghost{position:fixed;z-index:60;pointer-events:none;background:var(--p2);border:1px solid var(--bl);border-radius:10px;padding:8px 12px;opacity:.92;box-shadow:0 6px 20px #0008}
body.dg,body.dg *{cursor:default!important;user-select:none!important}
details.ovr{border:1px solid var(--ln2);border-radius:8px;padding:6px 8px;margin:6px 0}details.ovr summary{cursor:pointer;font-size:13px}.ovg{max-height:220px;overflow:auto;display:grid;gap:2px}.ovp{display:flex!important;justify-content:space-between;align-items:center;gap:8px;margin:0!important;font-size:12px;color:var(--tx)!important}.ovp select{width:auto;padding:2px 4px}

.v2h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:14px 0 6px}.v2h b{font-size:15px}.v2h .mu{font-size:12px;margin-top:2px}
.mt{min-width:150px;font-size:11px;color:var(--mu);text-align:right}.mt i{display:block;height:5px;border-radius:3px;background:var(--ln);margin:4px 0;overflow:hidden}.mt i u{display:block;height:100%;background:var(--bl);text-decoration:none}.mt i u.w{background:var(--yl)}.mt i u.d{background:var(--ac)}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}.tpl button{flex-direction:column;align-items:flex-start;text-align:left;gap:2px;padding:9px 11px}.tpl small{color:var(--mu);font-size:11px}
.vtools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.vtools button{padding:4px 10px;font-size:12px}
.vi{background:var(--bg);border:1px solid var(--ln);border-radius:12px;margin:8px 0;overflow:hidden}.vi.ct{border-left:4px solid var(--bl)}
.vh{display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:pointer}.vh:hover{background:var(--hv)}.vi-ic{width:30px;height:30px;border-radius:8px;background:var(--p2);display:grid;place-items:center;flex:none}
.vt{flex:1;min-width:0}.vt b{display:block;font-size:13px}.vt small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot{width:14px;height:14px;border-radius:50%;border:2px solid #fff3;flex:none}.vb{display:flex;gap:2px;flex:none}.vb button{padding:2px 6px;font-size:12px;background:transparent;border-color:transparent}.vb button:hover{border-color:var(--bl)}
.vbd{padding:2px 12px 12px;border-top:1px solid var(--ln)}
.tb{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}.tb button{padding:2px 8px;font-size:12px;min-width:28px;justify-content:center}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.sw button{width:24px;height:24px;padding:0;border-radius:50%;justify-content:center;font-size:11px}.sw button.on{outline:2px solid var(--tx);outline-offset:2px}.sw input[type=color]{width:34px;height:26px;padding:0;border-radius:6px}
.emp{border:2px dashed var(--ln);border-radius:12px;padding:20px;text-align:center;color:var(--mu);margin:8px 0}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}.pk button{flex-direction:row;align-items:center;text-align:left;gap:9px;padding:8px 10px}.pk small{display:block;color:var(--mu);font-size:11px}
.am.mini button{padding:4px 9px;font-size:12px}
.pc.nc{border-left:1px solid #3f4147}.pc .spb{font-size:10px;background:#4e5058;border-radius:4px;padding:1px 6px;color:#dbdee1;display:inline-block;margin-bottom:4px}
.li,svg.lucide{width:1.15em;height:1.15em;stroke-width:2;flex:none;vertical-align:-.2em}
.nv{display:flex;align-items:center;gap:9px}.nv svg{width:18px;height:18px}
.ic svg{width:18px;height:18px}.vi-ic svg{width:16px;height:16px}.bi .ic svg{width:17px;height:17px}.vb button svg,.ih button svg{width:14px;height:14px}
.fav svg{width:16px;height:16px}.fav.on svg{fill:currentColor}.sb span{display:flex;color:var(--mu)}.sb svg{width:16px;height:16px}
.gh2 button svg,.nh button svg{width:14px;height:14px}.pb svg,.mdh svg{width:14px;height:14px}
h2 svg,h3 svg{vertical-align:-.15em}.tb button svg{width:13px;height:13px}.sw button svg{width:12px;height:12px}.pk .vi-ic svg{width:16px;height:16px}

/* ---------- animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(10px)}60%{transform:scale(1.015)}100%{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastIn{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 #3ccf6e99}70%{box-shadow:0 0 0 8px #3ccf6e00}100%{box-shadow:0 0 0 0 #3ccf6e00}}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes selGlow{0%,100%{box-shadow:0 0 0 3px #4f7cf544}50%{box-shadow:0 0 0 6px #4f7cf522}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@keyframes portPulse{0%{box-shadow:0 0 0 0 #4f7cf5aa}100%{box-shadow:0 0 0 9px #4f7cf500}}
@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(220%) skewX(-20deg)}}
@keyframes spinOnce{to{transform:rotate(360deg)}}
@keyframes starPop{0%{transform:scale(1)}50%{transform:scale(1.5) rotate(18deg)}100%{transform:scale(1)}}
button,.btn,input,select,textarea,.nv,.cl,.card,.bi,.vr,.ic,.tabs div,.fav,.port,.cdot{transition:transform .18s cubic-bezier(.3,.7,.4,1.4),background .18s,border-color .18s,box-shadow .18s,color .18s,opacity .18s}
button,.btn{position:relative;overflow:hidden}
button:hover:not(:disabled),.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px #0004}
button:active:not(:disabled),.btn:active{transform:translateY(0) scale(.95);box-shadow:none}
.pr:after,.gr:after,.bl:after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,transparent,#ffffff40,transparent);transform:translateX(-120%) skewX(-20deg);pointer-events:none}
.pr:hover:after,.gr:hover:after,.bl:hover:after{animation:shine .7s}
.rip{position:absolute;border-radius:50%;background:#fff5;width:20px;height:20px;margin:-10px 0 0 -10px;pointer-events:none;animation:ripple .55s ease-out forwards}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 3px #4f7cf533}
#pg>h2,#pg>p,#pg>.sb,#pg>.cards,#pg>.card,#pg>.cl,#pg>.gh,#pg>div:not(.bd),.bd{animation:fadeUp .45s cubic-bezier(.2,.7,.2,1) both}
.bd{animation-name:fadeIn;animation-duration:.35s}
.cards>.card{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.cards>.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px #0006}
.cl:hover{transform:translateX(4px);box-shadow:0 4px 14px #0004}
.cl:hover>.ic{transform:rotate(-8deg) scale(1.1)}
.nv:hover{transform:translateX(4px)}.nv:hover svg{animation:floaty .9s ease-in-out infinite}
.nv.on{box-shadow:inset 3px 0 0 var(--ac)}
.bi:hover{transform:translateX(3px)}.bi:hover .ic{transform:scale(1.12) rotate(-6deg)}
.vr:hover{transform:translateX(3px)}
.ov{animation:fadeIn .2s both;backdrop-filter:blur(3px)}.mo{animation:popIn .35s cubic-bezier(.2,.8,.3,1.2) both}
.me{animation:slideIn .35s cubic-bezier(.2,.8,.3,1) both}
#toast{animation:toastIn .35s cubic-bezier(.2,.8,.3,1.2) both}
.dot.on{animation:pulseDot 2s infinite}
.logo img{transition:transform .5s}.logo:hover img{animation:spinOnce .7s}
.top .pill{transition:background .3s}
button.x:hover svg{animation:shake .45s}
.fav:hover{transform:scale(1.3) rotate(12deg)}.fav.on svg{animation:starPop .45s}
.tabs div{position:relative}.tabs div:hover{color:var(--tx)}
.tabs .on{animation:fadeIn .25s}
#edges path[stroke-dasharray]{}
#edges path:not([stroke-dasharray]){stroke-dasharray:10 6;animation:flow 1s linear infinite}
.gn{transition:border-color .2s,box-shadow .2s}
.gn.sel{animation:selGlow 2s ease-in-out infinite}
.gn:hover{border-color:#4f7cf588}
.gn.st .ic{animation:floaty 3s ease-in-out infinite}
.port:hover{animation:portPulse .8s infinite}

const editModal=id=>{const n=nodeById(id);M=n.data.modal=n.data.modal||fromFlat(n.data);mtab='p';me_()};

// ---------- databases page ----------
const msgBlocks=()=>cmd().nodes.filter(n=>['message','send_channel','dm'].includes(n.type)).map((n,k)=>[n.id,nm(SCHEMA[n.type].n)+' — '+(n.name||('#'+(k+1)))]);
let dbCur='default',dbRows=[];
const dbScopeLabel=s=>s==='g'?'Whole bot':s.startsWith('s:')?'Server '+s.slice(2):s.startsWith('u:')?'User '+s.slice(2):s.startsWith('m:')?'Server / user '+s.slice(2).replace(':',' / '):s;
const dbShow=v=>{const t=typeof v==='object'?JSON.stringify(v):String(v);return t.length>140?t.slice(0,140)+'…':t};
const dbScope=()=>{const k=$('#dsk').value,ids=$('#dsi').value.trim().split(/[\s,\/]+/).filter(Boolean);if(k==='g')return 'g';if(k==='m'){if(ids.length<2)throw new Error('Type the server ID and the user ID');return `m:${ids[0]}:${ids[1]}`}if(!ids[0])throw new Error('Type the ID');return `${k}:${ids[0]}`};
const drawDbs=()=>go(async()=>{
 const list=await api(`bots/${B.id}/databases`);B.databases=list.map(d=>d.name);if(!B.databases.includes(dbCur))dbCur='default';
 const t=await api(`bots/${B.id}/databases/${encodeURIComponent(dbCur)}`);dbRows=t.entries;
 $('#pg').innerHTML=`<h2><i data-lucide="database" class="li"></i> Databases</h2><p class="mu">Each bot can have several databases. Use them with the <b>Saved Data</b> block (pick one there, or set a default for each command / event). Stored in <code>data/users/${esc(me)}/bots/${esc(B.id)}/databases/</code>.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0">${list.map(d=>`<button class="${d.name===dbCur?'bl':''}" onclick="dbCur='${esc(d.name)}';drawDbs()">${esc(d.name)} <small>(${d.count})</small></button>`).join('')}<input id="dnn" placeholder="new database name" style="width:200px"><button class="pr" onclick="newDb()"><i data-lucide="plus" class="li"></i> Create</button></div>
 <div class="card" style="margin-bottom:16px"><h3>${esc(dbCur)}</h3>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div><label>Key</label><input id="dke"></div><div><label>Scope</label><select id="dsk"><option value="g">Whole bot</option><option value="s">Server</option><option value="u">User</option><option value="m">User per server</option></select></div><div><label>ID(s): server and/or user</label><input id="dsi" placeholder="server ID / user ID / both"></div></div>
 <div style="display:grid;grid-template-columns:160px 1fr;gap:10px"><div><label>Type</label><select id="dty">${['string','number','boolean','list','json'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Value (lists: one item per line)</label><textarea id="dva" style="min-height:60px"></textarea></div></div>
 <p style="display:flex;gap:8px"><button class="pr" onclick="saveDbe()"><i data-lucide="save" class="li"></i> Save value</button><button class="x" onclick="clearDb()"><i data-lucide="eraser" class="li"></i> Clear all</button>${dbCur!=='default'?'<button class="x" onclick="delDb()"><i data-lucide="trash" class="li"></i> Delete database</button>':''}</p></div>
 ${SB('Search keys...','.cl')}
 ${dbRows.map((e,j)=>`<div class="cl" style="cursor:default"><div style="flex:1;min-width:0"><b>${esc(e.name)}</b> <span class="mu">· ${esc(dbScopeLabel(e.scope))} · ${esc(e.type)}</span><div style="color:var(--yl);font:12px monospace;word-break:break-all">${esc(dbShow(e.value))}</div></div><button onclick="editDbe(${j})"><i data-lucide="pencil" class="li"></i></button><button class="x" onclick="delDbe(${j})"><i data-lucide="trash" class="li"></i></button></div>`).join('')||'<p class="mu">This database is empty.</p>'}`;
});
const newDb=()=>go(async()=>{const n=$('#dnn').value.trim().toLowerCase();await api(`bots/${B.id}/databases`,'POST',{name:n});dbCur=n;toast('Database created');drawDbs()});
const delDb=()=>confirm('Delete the database "'+dbCur+'" and all its values?')&&go(async()=>{await api(`bots/${B.id}/databases/${encodeURIComponent(dbCur)}`,'DELETE');dbCur='default';drawDbs()});
const clearDb=()=>confirm('Remove every value from "'+dbCur+'"?')&&go(async()=>{await api(`bots/${B.id}/databases/${encodeURIComponent(dbCur)}/clear`,'POST',{});drawDbs()});
const saveDbe=()=>go(async()=>{await api(`bots/${B.id}/databases/${encodeURIComponent(dbCur)}/entries`,'POST',{name:$('#dke').value,scope:dbScope(),type:$('#dty').value,value:$('#dva').value});toast('Saved');drawDbs()});
const editDbe=j=>{const e=dbRows[j],p=e.scope.split(':');$('#dke').value=e.name;$('#dsk').value=p[0];$('#dsi').value=p.slice(1).join(' ');$('#dty').value=e.type;$('#dva').value=typeof e.value==='object'?(e.type==='list'?e.value.join('\n'):JSON.stringify(e.value,null,2)):String(e.value);$('#pg').scrollTop=0};
const delDbe=j=>confirm('Delete this value?')&&go(async()=>{await api(`bots/${B.id}/databases/${encodeURIComponent(dbCur)}/entries/delete`,'POST',{key:dbRows[j].key});drawDbs()});

boot();</script></body></html>
